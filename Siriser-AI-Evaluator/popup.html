<!-- AI生成 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Siriser AI Auto Evaluator</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
<p data-aigc-mark="1" style="margin:0 0 8px;font-size:10px;line-height:1.3;color:#6b6560;font-weight:400;">AI生成</p>

  <header class="hd">
    <div>
      <div class="mark">SIRISER</div>
      <h1>AI Auto Evaluator</h1>
    </div>
    <span class="pill" id="statusPill">idle</span>
  </header>

  <section class="card">
    <div class="row">
      <button type="button" class="primary" id="btnOpenWorkbench">打开标注工作台</button>
      <button type="button" id="btnEval1">逐张评全部</button>
    </div>
    <div class="row">
      <button type="button" id="btnEval3">3张合评</button>
      <button type="button" id="btnEvalOne">只评当前</button>
    </div>
    <div class="row">
      <button type="button" id="btnCollect">仅读取任务</button>
      <button type="button" id="btnSubmit">提交当前题</button>
    </div>
    <div class="row">
      <button type="button" id="btnDiag">诊断选择器</button>
    </div>
    <div class="progress"><i id="prog"></i></div>
    <p class="status" id="statusText">就绪</p>
  </section>

  <section class="card">
    <h2>API 配置</h2>
    <label>API URL（自定义评分服务）
      <input type="url" id="apiUrl" placeholder="https://your-server/evaluate" />
    </label>
    <label>API Key
      <input type="password" id="apiKey" placeholder="可选 Bearer" />
    </label>
    <div class="sep">或 OpenAI 兼容视觉接口</div>
    <label>Base URL
      <input type="url" id="oaBase" placeholder="https://api.openai.com/v1" />
    </label>
    <label>Model（评委 A）
      <input type="text" id="oaModel" placeholder="qwen3-vl-32b-instruct" />
    </label>
    <label>Model 2（评委 B，填了则双模型合评）
      <input type="text" id="oaModel2" placeholder="qwen3.7-plus / 留空=单模型" />
    </label>
    <label>审核模型（分差大时裁决，可选）
      <input type="text" id="oaModelReview" placeholder="qwen-vl-max / 留空=用均值" />
    </label>
    <label>分差阈值（≥N 分才审核，建议 2）
      <input type="number" id="dualThreshold" min="1" max="5" value="2" />
    </label>
    <label>API Key
      <input type="password" id="oaKey" placeholder="sk-..." />
    </label>
    <label class="check">
      <input type="checkbox" id="autoSubmit" checked /> 填完自动提交
    </label>
    <label class="check">
      <input type="checkbox" id="autoNext" checked /> 提交后自动下一题
    </label>
    <button type="button" class="primary" id="btnSave">保存配置</button>
  </section>

  <section class="card">
    <h2>任务预览</h2>
    <pre id="preview" class="preview">（尚未读取）</pre>
  </section>

  <script src="popup.js"></script>
</body>
</html>
