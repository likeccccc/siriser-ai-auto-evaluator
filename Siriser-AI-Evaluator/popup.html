<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Siriser AI Auto Evaluator</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="hd">
    <div>
      <div class="mark">SIRISER</div>
      <h1>AI Auto Evaluator</h1>
    </div>
    <div class="hd-meta">
      <span class="pill" id="statusPill">idle</span>
      <span class="version" id="versionText"></span>
    </div>
  </header>

  <section class="card">
    <div class="row">
      <button type="button" class="primary" id="btnOpenWorkbench">打开标注工作台</button>
      <button type="button" id="btnEval1">逐张评全部</button>
    </div>
    <div class="row">
      <button type="button" id="btnEval3">3张合评</button>
      <button type="button" id="btnEvalOne">只评当前</button>
    </div>
    <div class="row">
      <button type="button" id="btnCollect">仅读取任务</button>
      <button type="button" id="btnSubmit">提交当前题</button>
    </div>
    <div class="row">
      <button type="button" id="btnTestDing">测试钉钉推送</button>
      <button type="button" id="btnTestTaskId">测试获取分包 ID</button>
    </div>
    <div class="row">
      <button type="button" id="btnTestModelA">测试评委 A</button>
      <button type="button" id="btnTestModelB">测试评委 B</button>
    </div>
    <div class="row">
      <button type="button" id="btnTestModelReview">测试审核模型</button>
      <button type="button" id="btnDiag">诊断选择器</button>
    </div>
    <div class="progress"><i id="prog"></i></div>
    <p class="status" id="statusText">就绪</p>
  </section>

  <section class="card">
    <h2>API 配置（OpenAI 兼容视觉接口）</h2>
    <label>API Key
      <input type="password" id="oaKey" placeholder="sk-..." />
    </label>
    <label>Base URL
      <input type="url" id="oaBase" placeholder="https://dashscope.aliyuncs.com/compatible-mode/v1" />
    </label>
    <label>Model（评委 A）
      <input type="text" id="oaModel" placeholder="qwen-vl-max / qwen3.7-plus" />
    </label>
    <label>Model 2（评委 B，可选；须能看图的 vl 模型）
      <input type="text" id="oaModel2" placeholder="留空 = 单模型" />
    </label>
    <label>审核模型（分差大时裁决，可选）
      <input type="text" id="oaModelReview" placeholder="qwen-vl-max / 留空=用均值" />
    </label>
    <label>评分模式
      <select id="scoringMode">
        <option value="fast">快速模式 · 最快最省</option>
        <option value="balanced">平衡模式 · 推荐</option>
        <option value="thinking">思考模式 · 最慢最贵</option>
      </select>
      <small class="field-hint" id="scoringModeHint"></small>
    </label>
    <label>分差阈值（≥N 分才审核，建议 3）
      <input type="number" id="dualThreshold" min="1" max="5" value="3" />
    </label>
    <label>钉钉 Webhook（异常推送）
      <input type="url" id="dingWebhook" placeholder="https://oapi.dingtalk.com/robot/send?access_token=..." />
    </label>
    <button type="button" class="primary" id="btnSave">保存配置</button>
    <div class="row">
      <button type="button" id="btnExportCfg">导出配置</button>
      <button type="button" id="btnImportCfg">导入配置</button>
    </div>
    <input type="file" id="cfgFile" accept="application/json,.json" hidden />
  </section>

  <section class="card">
    <h2>定时自动停止（可选）</h2>
    <label class="chk">
      <input type="checkbox" id="stopEnabled" />
      启用：到设定时间后先打完当前题再停，不再领取新题
    </label>
    <label>到点时间（24 小时制）
      <input type="time" id="stopTime" value="18:00" />
    </label>
    <small class="field-hint" id="stopHint"></small>
  </section>

  <section class="card">
    <h2>任务预览</h2>
    <pre id="preview" class="preview">（尚未读取）</pre>
  </section>

  <script src="popup.js"></script>
</body>
</html>
